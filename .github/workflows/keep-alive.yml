name: Keep Render Backend Awake

# Render 무료 플랜은 일정 시간 요청이 없으면 서버가 슬립 상태로 전환됩니다.
# 평일(월~금) 08:00~21:00 KST 동안 12분마다 /health 엔드포인트를 호출해 깨어있는 상태를 유지합니다.
# cron 시각은 UTC 기준이라 KST(UTC+9) 기준 시간대를 두 구간으로 나눠 표현했습니다.
#   - UTC 00:00~11:48, 월~금 → KST 09:00~20:48
#   - UTC 23:00~23:48, 일~목 → KST(다음날) 08:00~08:48
on:
  schedule:
    - cron: '*/12 0-11 * * 1-5'
    - cron: '*/12 23 * * 0-4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://corea-hoy-be-us.onrender.com/health)
          echo "Health check responded with status: $STATUS"
          if [ "$STATUS" -ge 400 ] || [ "$STATUS" -eq 000 ]; then
            echo "::warning::Unexpected status code from /health: $STATUS"
          fi
